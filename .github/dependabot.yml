# Keep GitHub Actions, NuGet and e2e (npm) dependencies current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /FirebotGiveawayObsOverlay
    schedule:
      interval: monthly
    groups:
      nuget:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: monthly
    groups:
      playwright:
        patterns: ["*"]
